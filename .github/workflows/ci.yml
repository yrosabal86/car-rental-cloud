name: CI - Cloud Native Build, Lint, Test & GHCR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-test-backends:
    name: Linters (Python & Dockerfile) y Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, rental-service]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Linter de Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: error

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Instalar dependencias y linters
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt
          pip install ruff

      - name: Linter de código Python (Ruff)
        run: ruff check ${{ matrix.service }}/app ${{ matrix.service }}/tests --select E,F --ignore E501

      - name: Ejecutar pruebas unitarias e integración (Pytest)
        working-directory: ${{ matrix.service }}
        run: pytest -v

  validate-frontend-and-compose:
    name: Validar Frontend Dockerfile y compose.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis de compose.yaml
        run: docker compose -f compose.yaml config --quiet

      - name: Linter de Dockerfile Frontend (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

  build-and-push-ghcr:
    name: Construir y Publicar Imágenes en GHCR
    needs: [lint-and-test-backends, validate-frontend-and-compose]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - auth-service
          - rental-service
          - frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos y etiquetas (SHA del commit y latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/car-rental-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
