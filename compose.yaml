services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car_rental_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      rental-service:
        condition: service_healthy
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: car_rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: car_rental_auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - app
      - data

  rental-service:
    build:
      context: ./rental-service
      dockerfile: Dockerfile
    container_name: car_rental_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rental_db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      AUTH_SERVICE_URL: http://auth-service:8001
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - app
      - data

volumes:
  pgdata:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
